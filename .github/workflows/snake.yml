name: Generate Animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate the snake svg files
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#A855F7&color_dots=#ebedf0,#93c5fd,#3b82f6,#1d4ed8,#1e3a8a
            dist/github-contribution-grid-snake-dark.svg?color_snake=#A855F7&color_dots=#161b22,#1e3a8a,#1e40af,#1d4ed8,#2563eb

      - name: Push the generated files to a branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
